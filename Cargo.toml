[package]
name = "mich-cdrive-clean"
version = "1.3.2"
edition = "2021"
description = "Safe, aggressive, repeatable C: drive cleaner — caches, temp, dumps, stale versions. Never touches anything needed."
authors = ["Michaelunkai"]
license = "MIT"

[[bin]]
name = "mich-cdrive-clean"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
